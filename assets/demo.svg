<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640"
  viewBox="0 0 1280 640" role="img"
  aria-labelledby="title description">
  <title id="title">auto-lint-pr token boundary demo</title>
  <desc id="description">
    A deterministic terminal transcript showing a token-free
    formatter phase and its exact file delta.
  </desc>
  <rect width="1280" height="640" fill="#0b1020"/>
  <rect x="42" y="42" width="1196" height="556" rx="24"
    fill="#111936" stroke="#33426f" stroke-width="2"/>
  <circle cx="82" cy="80" r="8" fill="#ff6b6b"/>
  <circle cx="110" cy="80" r="8" fill="#ffd166"/>
  <circle cx="138" cy="80" r="8" fill="#57d39b"/>
  <style>
    .terminal-line {
      fill: #e7ecff;
      font: 25px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
  </style>
  <text x="72" y="132" class="terminal-line">$ python3 auto_lint_pr.py prepare --lint-root &lt;pinned-lint&gt;</text>
  <text x="72" y="178" class="terminal-line">prepare phase: success</text>
  <text x="72" y="224" class="terminal-line">formatter credentials: absent</text>
  <text x="72" y="270" class="terminal-line">base commit recorded: True</text>
  <text x="72" y="316" class="terminal-line">branch: auto-lint/main</text>
  <text x="72" y="362" class="terminal-line">changed: true</text>
  <text x="72" y="408" class="terminal-line">exact delta: sample.txt</text>
  <text x="72" y="454" class="terminal-line">publish phase: not run in this token-free demo</text>
</svg>
