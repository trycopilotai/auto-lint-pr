name: Auto lint pull request

on:
  workflow_call:
    inputs:
      base:
        description: "Pull request base branch"
        required: false
        type: string
        default: main
      cwd:
        description: "Path below the consumer checkout"
        required: false
        type: string
        default: "."
      modified:
        description: "Format modified Git-tracked files"
        required: false
        type: boolean
        default: false
      docker:
        description:
          "Use pinned language-specific containers"
        required: false
        type: boolean
        default: true
      paths:
        description: "Shell-quoted explicit paths"
        required: false
        type: string
        default: ""
      files-from0:
        description: "NUL-delimited path file"
        required: false
        type: string
        default: ""
      languages:
        description: "Comma-separated lint language ids"
        required: false
        type: string
        default: ""
      print-width:
        description:
          "Positive line width for the pinned lint run"
        required: false
        type: string
        default: ""
      hook:
        description: "Token-free command after formatting"
        required: false
        type: string
        default: ""
      labels:
        description: "Comma-separated labels"
        required: false
        type: string
        default: ""
      reviewers:
        description: "Comma-separated reviewer logins"
        required: false
        type: string
        default: ""
      title:
        description: "Pull request title"
        required: false
        type: string
        default: "Apply automated formatting"
      body:
        description: "Pull request body"
        required: false
        type: string
        default: >-
          This pull request contains only the delta produced
          by the pinned trycopilotai/lint release.
    secrets:
      checkout_token:
        description:
          "Optional read token for private dependency
          checkouts; never used for publication"
        required: false
      registry_token:
        description:
          "Optional package-read token used only to prefetch
          private lint images; never passed to formatting"
        required: false

permissions:
  contents: read

concurrency:
  group:
    "auto-lint-${{ github.repository }}-${{ inputs.base }}"
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      base-head: "${{ steps.prepare.outputs.base-head }}"
      changed: "${{ steps.prepare.outputs.changed }}"
    steps:
      - name: Check out consumer base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ inputs.base }}"
          persist-credentials: false
          path: workspace
      - name: Check out pinned lint
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: trycopilotai/lint
          ref: refs/tags/v0.1.8
          fetch-depth: 0
          token:
            "${{ secrets.checkout_token || github.token }}"
          persist-credentials: false
          path: dependencies/lint
      - name: Require reusable workflow identity
        env:
          WORKFLOW_REPOSITORY:
            "${{ job.workflow_repository }}"
          WORKFLOW_SHA: "${{ job.workflow_sha }}"
        shell: bash
        run: |
          if test -n "$WORKFLOW_REPOSITORY" &&
            test -n "$WORKFLOW_SHA"; then
            exit 0
          fi
          printf '%s\n' \
            "job.workflow_repository or job.workflow_sha is empty." \
            "These reusable-workflow identity fields are documented" \
            "for GitHub Cloud only, so an empty value usually means" \
            "this workflow is running on GitHub Enterprise Server," \
            "where the action-revision checkout would silently fetch" \
            "the caller repository at its default branch instead." >&2
          exit 1
      - name: Check out this action revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: "${{ job.workflow_repository }}"
          ref: "${{ job.workflow_sha }}"
          token:
            "${{ secrets.checkout_token || github.token }}"
          persist-credentials: false
          path: dependencies/auto-lint-pr
      - name: Resolve authenticated image references
        if: inputs.docker
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          LINT_LANGUAGES: "${{ inputs.languages }}"
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/docker-clean"
          python3 \
            dependencies/auto-lint-pr/tools/prefetch_images.py \
            --lint-root dependencies/lint \
            --manifest \
              dependencies/auto-lint-pr/lint-release-manifest.json \
            --dependency \
              dependencies/auto-lint-pr/lint-dependency.json \
            --allowed-signers \
              dependencies/auto-lint-pr/.github/lint-release-allowed-signers \
            --languages "$LINT_LANGUAGES" \
            >"$RUNNER_TEMP/lint-image-references"
          test -s "$RUNNER_TEMP/lint-image-references"
      - name: Prefetch private images by exact digest
        if: inputs.docker
        env:
          REGISTRY_TOKEN:
            "${{ secrets.registry_token ||
            secrets.checkout_token || github.token }}"
        shell: bash
        run: |
          registry_token=$REGISTRY_TOKEN
          unset REGISTRY_TOKEN
          docker_path=/usr/bin/docker
          if ! test -x "$docker_path"; then
            printf '%s\n' "trusted Docker CLI is unavailable" >&2
            exit 1
          fi
          auth="$RUNNER_TEMP/docker-auth"
          mkdir -m 700 "$auth"
          cleanup() {
            if test -d "$auth"; then
              find "$auth" -type f -delete
              find "$auth" -depth -type d -empty -delete
            fi
          }
          trap cleanup EXIT
          printf '%s' "$registry_token" | \
            DOCKER_CONFIG="$auth" "$docker_path" login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
          while IFS= read -r image; do
            DOCKER_CONFIG="$auth" "$docker_path" pull "$image"
          done <"$RUNNER_TEMP/lint-image-references"
          DOCKER_CONFIG="$auth" "$docker_path" logout ghcr.io
          if grep -F -q 'ghcr.io' "$auth/config.json"; then
            printf '%s\n' \
              "registry credentials survived logout" >&2
            exit 1
          fi
          cleanup
          trap - EXIT
      - name: Prepare formatting without write credentials
        id: prepare
        uses: ./dependencies/auto-lint-pr
        env:
          DOCKER_CONFIG: "${{ runner.temp }}/docker-clean"
        with:
          phase: prepare
          lint-root: dependencies/lint
          state-path:
            "${{ runner.temp }}/auto-lint-state.json"
          verification-path:
            "${{ runner.temp }}/auto-lint-verified.json"
          cwd: "workspace/${{ inputs.cwd }}"
          workspace-root: workspace
          base: "${{ inputs.base }}"
          modified: "${{ inputs.modified }}"
          docker: "${{ inputs.docker }}"
          paths: "${{ inputs.paths }}"
          files-from0: "${{ inputs.files-from0 }}"
          languages: "${{ inputs.languages }}"
          print-width: "${{ inputs.print-width }}"
          hook: "${{ inputs.hook }}"
          labels: "${{ inputs.labels }}"
          reviewers: "${{ inputs.reviewers }}"
          title: "${{ inputs.title }}"
          body: "${{ inputs.body }}"
      - name: Upload exact prepared transaction
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auto-lint-pr-state
          path: "${{ runner.temp }}/auto-lint-state.json"
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      action-archive-sha:
        "${{ steps.package.outputs.action-archive-sha }}"
      consumer-bundle-sha:
        "${{ steps.package.outputs.consumer-bundle-sha }}"
      state-sha: "${{ steps.package.outputs.state-sha }}"
      verification-sha:
        "${{ steps.package.outputs.verification-sha }}"
    steps:
      - name: Check out exact consumer base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ needs.prepare.outputs.base-head }}"
          fetch-depth: 0
          persist-credentials: false
          path: workspace
      - name: Require reusable workflow identity
        env:
          WORKFLOW_REPOSITORY:
            "${{ job.workflow_repository }}"
          WORKFLOW_SHA: "${{ job.workflow_sha }}"
        shell: bash
        run: |
          if test -n "$WORKFLOW_REPOSITORY" &&
            test -n "$WORKFLOW_SHA"; then
            exit 0
          fi
          printf '%s\n' \
            "job.workflow_repository or job.workflow_sha is empty." \
            "These reusable-workflow identity fields are documented" \
            "for GitHub Cloud only, so an empty value usually means" \
            "this workflow is running on GitHub Enterprise Server," \
            "where the action-revision checkout would silently fetch" \
            "the caller repository at its default branch instead." >&2
          exit 1
      - name: Check out this action revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: "${{ job.workflow_repository }}"
          ref: "${{ job.workflow_sha }}"
          token:
            "${{ secrets.checkout_token || github.token }}"
          persist-credentials: false
          path: dependencies/auto-lint-pr
      - name: Download prepared transaction
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: auto-lint-pr-state
          path: "${{ runner.temp }}/prepared"
      - name: Verify in a fresh read-only job
        uses: ./dependencies/auto-lint-pr
        with:
          phase: verify
          state-path:
            "${{ runner.temp
            }}/prepared/auto-lint-state.json"
          verification-path:
            "${{ runner.temp }}/auto-lint-preverified.json"
          cwd: "workspace/${{ inputs.cwd }}"
          workspace-root: workspace
          base: "${{ inputs.base }}"
      - name: Package immutable publication inputs
        id: package
        shell: bash
        env:
          BASE_HEAD:
            "${{ needs.prepare.outputs.base-head }}"
        run: |
          package="$RUNNER_TEMP/publication"
          mkdir "$package"
          cp \
            "$RUNNER_TEMP/prepared/auto-lint-state.json" \
            "$package/auto-lint-state.json"
          cp \
            "$RUNNER_TEMP/auto-lint-preverified.json" \
            "$package/auto-lint-preverified.json"
          git -C workspace update-ref \
            refs/auto-lint-pr/base "$BASE_HEAD"
          git -C workspace bundle create \
            "$package/consumer-base.bundle" \
            refs/auto-lint-pr/base
          git -C workspace update-ref -d \
            refs/auto-lint-pr/base
          git -C dependencies/auto-lint-pr archive \
            --format=tar \
            --prefix=auto-lint-pr/ \
            HEAD |
            gzip -n >"$package/auto-lint-pr.tar.gz"
          {
            printf 'action-archive-sha=%s\n' \
              "$(sha256sum "$package/auto-lint-pr.tar.gz" | cut -d' ' -f1)"
            printf 'consumer-bundle-sha=%s\n' \
              "$(sha256sum "$package/consumer-base.bundle" | cut -d' ' -f1)"
            printf 'state-sha=%s\n' \
              "$(sha256sum "$package/auto-lint-state.json" | cut -d' ' -f1)"
            printf 'verification-sha=%s\n' \
              "$(sha256sum "$package/auto-lint-preverified.json" | cut -d' ' -f1)"
          } >>"$GITHUB_OUTPUT"
      - name: Upload immutable publication inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auto-lint-pr-publication
          path: "${{ runner.temp }}/publication"
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - prepare
      - verify
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Download immutable publication inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: auto-lint-pr-publication
          path: "${{ runner.temp }}/publication"
      - name: Restore verified publication inputs
        shell: bash
        env:
          ACTION_ARCHIVE_SHA:
            "${{ needs.verify.outputs.action-archive-sha }}"
          BASE_HEAD:
            "${{ needs.prepare.outputs.base-head }}"
          CONSUMER_BUNDLE_SHA:
            "${{ needs.verify.outputs.consumer-bundle-sha }}"
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          STATE_SHA: "${{ needs.verify.outputs.state-sha }}"
          VERIFICATION_SHA:
            "${{ needs.verify.outputs.verification-sha }}"
        run: |
          package="$RUNNER_TEMP/publication"
          test "$(sha256sum "$package/auto-lint-pr.tar.gz" | cut -d' ' -f1)" = \
            "$ACTION_ARCHIVE_SHA"
          test "$(sha256sum "$package/consumer-base.bundle" | cut -d' ' -f1)" = \
            "$CONSUMER_BUNDLE_SHA"
          test "$(sha256sum "$package/auto-lint-state.json" | cut -d' ' -f1)" = \
            "$STATE_SHA"
          test "$(sha256sum "$package/auto-lint-preverified.json" | cut -d' ' -f1)" = \
            "$VERIFICATION_SHA"
          mkdir -p dependencies workspace
          tar -xzf "$package/auto-lint-pr.tar.gz" \
            -C dependencies
          git -C workspace init -q
          git -C workspace fetch -q \
            "$package/consumer-base.bundle" \
            refs/auto-lint-pr/base
          git -C workspace checkout -q --detach FETCH_HEAD
          test "$(git -C workspace rev-parse HEAD)" = \
            "$BASE_HEAD"
      - name: Reverify then publish the exact delta
        uses: ./dependencies/auto-lint-pr
        with:
          phase: publish
          token: "${{ github.token }}"
          state-path:
            "${{ runner.temp
            }}/publication/auto-lint-state.json"
          verification-path:
            "${{ runner.temp
            }}/auto-lint-final-verified.json"
          cwd: "workspace/${{ inputs.cwd }}"
          workspace-root: workspace
          base: "${{ inputs.base }}"
          labels: "${{ inputs.labels }}"
          reviewers: "${{ inputs.reviewers }}"
          title: "${{ inputs.title }}"
          body: "${{ inputs.body }}"
