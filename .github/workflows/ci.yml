name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name:
      "test (${{ matrix.os }}, Python ${{ matrix.python }})"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          # The demo evidence assertions read the commit the
          # manifest was generated against, so the history has
          # to be here for them to read.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "${{ matrix.python }}"
      - name: Verify repository
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python tools/verify_repo.py

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check Python formatting
        run: >-
          pipx run --spec black==24.10.0 black --check
          --diff auto_lint_pr.py action_entrypoint.py tests
          tools scripts
      - name: Check document codec
        run: >-
          npx -y prettier@3.7.4 --check --print-width 60
          --prose-wrap always --trailing-comma none
          README.md CONTRIBUTING.md SECURITY.md action.yml
          .github .claude-plugin .codex-plugin docs evidence
          skills lint-dependency.json
          lint-release-manifest.json

  pinned-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: auto-lint-pr
      - name: Check out fresh verification source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: verification-source
      - name: Check out pinned lint release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: trycopilotai/lint
          ref: refs/tags/v0.1.7
          fetch-depth: 0
          token:
            "${{ secrets.checkout_token || github.token }}"
          persist-credentials: false
          path: lint
      - name: Exercise token-free prepare and verification
        working-directory: auto-lint-pr
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        shell: bash
        run: |
          state="$RUNNER_TEMP/auto-lint-pr-state.json"
          verification="$RUNNER_TEMP/auto-lint-pr-verified.json"
          python3 auto_lint_pr.py prepare \
            --lint-root ../lint \
            --local \
            --cwd fixtures/integration \
            --language requirements \
            --state "$state"
          diff -u \
            fixtures/integration/expected.txt \
            fixtures/integration/requirements.txt
          test "$(git diff --name-only)" = \
            "fixtures/integration/requirements.txt"
          python3 - "$state" <<'PY'
          import json
          import sys
          from pathlib import Path

          state = json.loads(
              Path(sys.argv[1]).read_text(encoding="utf-8")
          )
          paths = [record["path"] for record in state["delta"]]
          expected = ["fixtures/integration/requirements.txt"]
          if paths != expected:
              raise SystemExit(f"unexpected delta: {paths}")
          if state["changed"] is not True:
              raise SystemExit("prepare did not report a change")
          PY
          python3 ../verification-source/auto_lint_pr.py verify \
            --base main \
            --cwd ../verification-source/fixtures/integration \
            --state "$state" \
            --verification "$verification" \
            --restore
          diff -u \
            ../verification-source/fixtures/integration/expected.txt \
            ../verification-source/fixtures/integration/requirements.txt
          test "$(git -C ../verification-source diff --name-only)" = \
            "fixtures/integration/requirements.txt"
          python3 - "$state" "$verification" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          state_path = Path(sys.argv[1])
          receipt = json.loads(
              Path(sys.argv[2]).read_text(encoding="utf-8")
          )
          expected_sha = hashlib.sha256(
              state_path.read_bytes()
          ).hexdigest()
          expected_cwd = str(
              (Path.cwd().parent / "verification-source").resolve()
          )
          if receipt["state_sha256"] != expected_sha:
              raise SystemExit("verification receipt has the wrong state")
          if receipt["cwd"] != expected_cwd:
              raise SystemExit("verification receipt has the wrong checkout")
          PY
          tampered="$RUNNER_TEMP/auto-lint-pr-tampered.json"
          cp "$state" "$tampered"
          printf '\n' >>"$tampered"
          if python3 ../verification-source/auto_lint_pr.py publish \
            --base main \
            --cwd ../verification-source/fixtures/integration \
            --state "$tampered" \
            --verification "$verification" \
            2>"$RUNNER_TEMP/tampered-state.stderr"; then
            printf '%s\n' "tampered state unexpectedly published" >&2
            exit 1
          fi
          grep -F \
            "token-free verification receipt does not match" \
            "$RUNNER_TEMP/tampered-state.stderr"

  pinned-lint-docker:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          path: auto-lint-pr
      - name: Check out pinned lint release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: trycopilotai/lint
          ref: refs/tags/v0.1.7
          fetch-depth: 0
          token:
            "${{ secrets.checkout_token || github.token }}"
          persist-credentials: false
          path: lint
      - name: Resolve exact signed image reference
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_RUNTIME_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        shell: bash
        working-directory: auto-lint-pr
        run: |
          python3 tools/prefetch_images.py \
            --lint-root ../lint \
            --manifest lint-release-manifest.json \
            --dependency lint-dependency.json \
            --allowed-signers \
              .github/lint-release-allowed-signers \
            --languages requirements \
            >"$RUNNER_TEMP/lint-image-references"
          test -s "$RUNNER_TEMP/lint-image-references"
      - name: Authenticated exact-digest prefetch
        env:
          PREFETCH_TOKEN:
            "${{ secrets.checkout_token || github.token }}"
        shell: bash
        working-directory: auto-lint-pr
        run: |
          auth="$RUNNER_TEMP/docker-auth"
          mkdir -m 700 "$auth"
          cleanup() {
            if test -d "$auth"; then
              find "$auth" -type f -delete
              find "$auth" -depth -type d -empty -delete
            fi
          }
          trap cleanup EXIT
          printf '%s' "$PREFETCH_TOKEN" | \
            DOCKER_CONFIG="$auth" docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
          while IFS= read -r image; do
            DOCKER_CONFIG="$auth" docker pull "$image"
          done <"$RUNNER_TEMP/lint-image-references"
          DOCKER_CONFIG="$auth" docker logout ghcr.io
          if grep -F -q 'ghcr.io' "$auth/config.json"; then
            printf '%s\n' \
              "registry credentials survived logout" >&2
            exit 1
          fi
          cleanup
          trap - EXIT
      - name: Exercise token-free default Docker transaction
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: "formatter-must-not-receive"
          ACTIONS_RUNTIME_TOKEN: "formatter-must-not-receive"
          DOCKER_CONFIG: "${{ runner.temp }}/docker-clean"
          GH_TOKEN: "formatter-must-not-receive"
          GITHUB_TOKEN: "formatter-must-not-receive"
        shell: bash
        working-directory: auto-lint-pr
        run: |
          mkdir "$DOCKER_CONFIG"
          state="$RUNNER_TEMP/auto-lint-pr-docker-state.json"
          hook="$RUNNER_TEMP/token-free-hook"
          cat >"$hook" <<'SH'
          test -z "${GITHUB_TOKEN+x}${GH_TOKEN+x}${ACTIONS_ID_TOKEN_REQUEST_TOKEN+x}${ACTIONS_RUNTIME_TOKEN+x}"
          SH
          python3 auto_lint_pr.py prepare \
            --lint-root ../lint \
            --cwd fixtures/integration \
            --language requirements \
            --hook "sh $hook" \
            --state "$state"
          diff -u \
            fixtures/integration/expected.txt \
            fixtures/integration/requirements.txt
          python3 - "$state" <<'PY'
          import json
          import sys
          from pathlib import Path

          state = json.loads(
              Path(sys.argv[1]).read_text(encoding="utf-8")
          )
          name = "ghcr.io/trycopilotai/lint-requirements"
          digest = state["lint_release"]["images"][name]
          if not digest.startswith("sha256:"):
              raise SystemExit("transaction did not bind the image digest")
          manifest = json.loads(
              Path("lint-release-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          if digest != manifest["images"][name]:
              raise SystemExit(
                  "transaction digest does not equal the recorded manifest digest"
              )
          PY
