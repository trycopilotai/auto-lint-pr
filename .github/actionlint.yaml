paths:
  .github/workflows/auto-lint-pr.yml:
    ignore:
      # GitHub Cloud documents these reusable-workflow job
      # identity fields in its Actions context reference.
      # actionlint 1.7.12 does not model them yet.
      - 'property "workflow_repository" is not defined in
        object type'
      - 'property "workflow_sha" is not defined in object
        type'
