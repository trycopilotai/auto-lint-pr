name: "auto-lint-pr"
description:
  "Turn pinned formatter output into a reviewable pull
  request"
inputs:
  phase:
    description:
      "Transaction phase; prepare must run in a job without
      write permissions, and publish in a fresh job"
    required: false
    default: "prepare"
  token:
    description:
      "Repository-scoped Actions token used only by the
      publish step"
    required: false
  lint-root:
    description:
      "Path to the pinned trycopilotai/lint checkout"
    required: false
    default: ""
  state-path:
    description: "Cross-job transaction state artifact path"
    required: true
  verification-path:
    description: "Token-free verification receipt path"
    required: true
  cwd:
    description: "Consumer repository working directory"
    required: false
    default: "."
  base:
    description: "Pull request base branch"
    required: false
    default: "main"
  modified:
    description: "Format only modified Git-tracked files"
    required: false
    default: "false"
  docker:
    description: "Use pinned language-specific containers"
    required: false
    default: "true"
  paths:
    description: "Shell-quoted explicit paths"
    required: false
    default: ""
  files-from0:
    description: "NUL-delimited path file"
    required: false
    default: ""
  languages:
    description: "Comma-separated lint language ids"
    required: false
    default: ""
  hook:
    description:
      "Token-free consumer command after formatting"
    required: false
    default: ""
  labels:
    description: "Comma-separated labels"
    required: false
    default: ""
  reviewers:
    description: "Comma-separated reviewer logins"
    required: false
    default: ""
  title:
    description: "Pull request title"
    required: false
    default: "Apply automated formatting"
  body:
    description: "Pull request body"
    required: false
    default:
      "This pull request contains only the delta produced by
      the pinned trycopilotai/lint release."
outputs:
  changed:
    description: "Whether a formatting delta was published"
    value:
      "${{ steps.publish.outputs.changed ||
      steps.verify.outputs.changed ||
      steps.prepare.outputs.changed }}"
  base-head:
    description: "Exact consumer base commit"
    value:
      "${{ steps.verify.outputs.base-head ||
      steps.prepare.outputs.base-head }}"
  pull-request:
    description: "Created or updated pull request number"
    value: "${{ steps.publish.outputs.pull-request }}"
runs:
  using: "composite"
  steps:
    - name: Validate transaction phase
      if: >-
        inputs.phase != 'prepare' && inputs.phase !=
        'publish'
      shell: bash
      run: |
        printf '%s\n' "phase must be prepare or publish" >&2
        exit 2
    - name: Prepare token-free formatting delta
      id: prepare
      if: inputs.phase == 'prepare'
      shell: bash
      env:
        GH_TOKEN: ""
        GITHUB_TOKEN: ""
        INPUT_BASE: "${{ inputs.base }}"
        INPUT_BODY: "${{ inputs.body }}"
        INPUT_CWD: "${{ inputs.cwd }}"
        INPUT_DOCKER: "${{ inputs.docker }}"
        INPUT_FILES_FROM0: "${{ inputs.files-from0 }}"
        INPUT_HOOK: "${{ inputs.hook }}"
        INPUT_LABELS: "${{ inputs.labels }}"
        INPUT_LANGUAGES: "${{ inputs.languages }}"
        INPUT_MODIFIED: "${{ inputs.modified }}"
        INPUT_PATHS: "${{ inputs.paths }}"
        INPUT_REVIEWERS: "${{ inputs.reviewers }}"
        INPUT_TITLE: "${{ inputs.title }}"
        INPUT_TOKEN: ""
        LINT_ROOT: "${{ inputs.lint-root }}"
        STATE_PATH: "${{ inputs.state-path }}"
      run: >-
        python3 "$GITHUB_ACTION_PATH/action_entrypoint.py"
        prepare
    - name: Restore and verify exact prepared delta
      id: verify
      if: inputs.phase == 'publish'
      shell: bash
      env:
        GH_TOKEN: ""
        GITHUB_TOKEN: ""
        INPUT_BASE: "${{ inputs.base }}"
        INPUT_CWD: "${{ inputs.cwd }}"
        INPUT_TOKEN: ""
        STATE_PATH: "${{ inputs.state-path }}"
        VERIFICATION_PATH: "${{ inputs.verification-path }}"
      run: >-
        python3 "$GITHUB_ACTION_PATH/action_entrypoint.py"
        verify
    - name: Publish exact verified delta
      id: publish
      if: >-
        inputs.phase == 'publish' &&
        steps.verify.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: "${{ inputs.token }}"
        INPUT_BASE: "${{ inputs.base }}"
        INPUT_BODY: "${{ inputs.body }}"
        INPUT_CWD: "${{ inputs.cwd }}"
        INPUT_LABELS: "${{ inputs.labels }}"
        INPUT_REVIEWERS: "${{ inputs.reviewers }}"
        INPUT_TITLE: "${{ inputs.title }}"
        STATE_PATH: "${{ inputs.state-path }}"
        VERIFICATION_PATH: "${{ inputs.verification-path }}"
      run: >-
        python3 "$GITHUB_ACTION_PATH/action_entrypoint.py"
        publish
